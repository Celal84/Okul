<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Matematik Adaları</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Nunito","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:17px;color:#2d3436;background:linear-gradient(180deg,#cfeaff,#fff6e9);background-attachment:fixed;min-height:100vh;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:28px}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;cursor:pointer;background:none}
button:active{transform:scale(.96)}
input{font-family:inherit;font-size:18px;width:100%;padding:12px 14px;border:2.5px solid #dfe6e9;border-radius:14px;outline:none;background:#fff;-webkit-user-select:text;user-select:text}
input:focus{border-color:#6c5ce7}
h1,h2,h3,h4{margin:.3em 0}
.muted{color:#636e72;font-size:14px}.cen{text-align:center}
.pad{padding:14px}
.card{background:#fff;border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 6px 18px rgba(45,52,54,.08)}
.row{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:12px}.row.wrap{flex-wrap:wrap}
.row>.btn{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 18px;border-radius:16px;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.15);color:#fff;background:#6c5ce7;line-height:1.2}
.btn.pr{background:linear-gradient(180deg,#8c7cff,#6c5ce7)}.btn.ok{background:linear-gradient(180deg,#2ee6a8,#00b894)}.btn.no{background:linear-gradient(180deg,#ff8f8f,#e74c3c)}.btn.gr{background:#dfe6e9;color:#2d3436}
.btn.sm{padding:8px 13px;font-size:15px;border-radius:12px}.btn.big{width:100%;padding:16px;font-size:19px;margin-top:10px}
.btn:disabled{opacity:.4}
.btn.spk2{flex:0 0 56px;background:#ffeaa7;color:#2d3436}
/* üst bar */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 12px;color:#fff;background:linear-gradient(135deg,#6c5ce7,#a29bfe);box-shadow:0 4px 14px rgba(0,0,0,.15);border-radius:0 0 22px 22px}
.bk{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.25);font-size:28px;font-weight:900;line-height:1;color:#fff;flex:0 0 42px}
.bt{flex:1;font-weight:900;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cn{background:rgba(255,255,255,.25);padding:6px 11px;border-radius:12px;font-size:15px}
/* hoş geldin */
.wel{padding:20px 16px}.logo{text-align:center;margin:10px 0 16px}.lgi{font-size:76px;animation:bob 2.5s ease-in-out infinite}
.logo h1{font-size:34px;font-weight:900;background:linear-gradient(90deg,#6c5ce7,#e84393,#f39c12);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo p{margin:0;color:#636e72;font-weight:700}
.wel label{display:block;font-weight:800;margin:14px 0 8px}
.gsel .gb{flex:1;background:#f1f2f6;border-radius:18px;padding:12px 4px;font-size:30px;display:flex;flex-direction:column;align-items:center;border:3px solid transparent}
.gsel .gb b{font-size:15px}.gb.on,.ab.on{border-color:#6c5ce7!important;background:#efeaff!important}
.avsel .ab{font-size:44px;width:76px;height:76px;border-radius:20px;background:#f1f2f6;border:3px solid transparent}
@keyframes bob{50%{transform:translateY(-8px)}}
/* ana ekran */
.home{padding:14px}
.hero{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;border-radius:26px;padding:14px;box-shadow:0 8px 20px rgba(108,92,231,.35)}
.hero .av{font-size:44px;width:68px;height:68px;border-radius:22px;background:rgba(255,255,255,.25);flex:0 0 68px}
.hi{flex:1;min-width:0}.hn{font-weight:900;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lv{font-size:14px;opacity:.9}
.xpb,.gbar,.ipb{height:10px;background:rgba(255,255,255,.3);border-radius:8px;overflow:hidden;margin-top:6px}.xpb i,.gbar i,.ipb i{display:block;height:100%;background:#ffeaa7;border-radius:8px;transition:width .5s}
.hs{display:flex;flex-direction:column;gap:6px;font-weight:800}.hs span{background:rgba(255,255,255,.25);padding:4px 9px;border-radius:10px;font-size:15px}
.goal{background:#fff;border-radius:18px;padding:12px 14px;margin-top:12px;box-shadow:0 4px 12px rgba(0,0,0,.06)}.goal .gbar{background:#f1f2f6}.goal .gbar i{background:linear-gradient(90deg,#00b894,#55efc4)}
.owl{display:flex;align-items:flex-end;gap:8px;margin:14px 0 4px}.ow{font-size:46px;animation:bob 3s ease-in-out infinite}
.bub{background:#fff;border-radius:18px 18px 18px 4px;padding:10px 13px;font-size:15px;box-shadow:0 4px 12px rgba(0,0,0,.07);flex:1}
.cont{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;background:linear-gradient(135deg,#00b894,#55efc4);color:#fff;border-radius:20px;padding:12px 16px;text-align:left;box-shadow:0 6px 16px rgba(0,184,148,.35)}
.cont span{font-size:34px}.cont div{flex:1}.cont small{display:block;opacity:.9}.cont b{font-size:18px}.cont em{font-style:normal;font-size:24px}
.sh{margin:18px 4px 8px;font-weight:900}
.isles{display:flex;flex-direction:column;gap:12px}
.isle{position:relative;display:flex;align-items:center;gap:12px;color:#fff;border-radius:24px;padding:14px;text-align:left;box-shadow:0 8px 18px rgba(0,0,0,.15);overflow:hidden}
.isle .ie{font-size:52px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.2))}.it{flex:1}.it b{font-size:20px;display:block}.it small{opacity:.95}
.mine{position:absolute;top:8px;right:10px;font-style:normal;font-size:12px;font-weight:800;background:#fff;color:#2d3436;padding:3px 8px;border-radius:10px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{position:relative;background:#fff;border-radius:20px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 4px 12px rgba(0,0,0,.07);font-size:14px}
.tile span{font-size:34px}.tile em{position:absolute;top:6px;right:8px;background:#e74c3c;color:#fff;font-style:normal;font-size:12px;font-weight:800;border-radius:10px;padding:1px 7px}.tile em.g{background:#00b894}
.tile.lab small{color:#636e72;text-align:center;font-size:12px}
.lab2 .tiles,.pad .tiles{grid-template-columns:repeat(2,1fr)}
.foot{text-align:center;color:#636e72;font-size:12px;margin-top:20px}
/* ada */
.ihead{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-weight:800}
.map{position:relative;margin:0 6px}.map svg{position:absolute;inset:0;width:100%;height:100%}
.nd{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:130px}
.nd:active{transform:translate(-50%,-50%) scale(.95)}.nd .st{margin-top:8px}
.ni{width:74px;height:74px;border-radius:50%;background:#fff;font-size:36px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 #b2bec3,0 8px 16px rgba(0,0,0,.15);border:4px solid #fff}
.nd.gold .ni{border-color:#fdcb6e;box-shadow:0 6px 0 #e1a83a,0 8px 16px rgba(0,0,0,.15)}
.nd.lk .ni{background:#dfe6e9;filter:grayscale(1);opacity:.75}
.nl{font-size:13px;font-weight:800;background:rgba(255,255,255,.92);border-radius:10px;padding:2px 8px;margin-top:2px;text-align:center;line-height:1.2;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.nd.lk .nl{opacity:.6}
.nd.pulse .ni{animation:pulse 1.4s infinite}@keyframes pulse{50%{transform:scale(1.1);box-shadow:0 6px 0 #b2bec3,0 0 0 10px rgba(108,92,231,.25)}}
.dc{position:absolute;font-size:30px;opacity:.85;pointer-events:none}
.st{display:inline-flex;gap:1px;font-size:16px;line-height:1}.st i{font-style:normal;color:#dfe6e9;text-shadow:0 1px 0 rgba(0,0,0,.1)}.st i.on{color:#fdcb6e}
.st.big{font-size:34px}.st.huge{font-size:56px;margin:6px 0}.st.huge i.on{animation:star .6s backwards}.st.huge i:nth-child(2){animation-delay:.2s}.st.huge i:nth-child(3){animation-delay:.4s}
@keyframes star{0%{transform:scale(0) rotate(-90deg)}80%{transform:scale(1.3)}}
/* konu */
.tp{padding:16px;text-align:center}.tico{font-size:70px;margin-top:6px}.tp h2{font-weight:900}
.act{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border-radius:22px;padding:14px 16px;margin-top:12px;box-shadow:0 5px 0 rgba(0,0,0,.08),0 6px 14px rgba(0,0,0,.06);border-left:8px solid}
.act span{font-size:34px}.act div{flex:1}.act b{font-size:19px;display:block}.act small{color:#636e72}.act em{font-style:normal;color:#00b894;font-weight:900}
.a1{border-color:#74b9ff}.a2{border-color:#55efc4}.a3{border-color:#fdcb6e}.a4{border-color:#fd79a8}
/* öğren */
.learn{padding:14px}.lc{background:#fff;border-radius:24px;padding:18px;box-shadow:0 6px 18px rgba(0,0,0,.08);min-height:300px}
.lc h3{color:#6c5ce7;font-weight:900;font-size:22px}.lv2{margin:12px 0;text-align:center;overflow-x:auto}.lx{font-size:18px;line-height:1.55}
.dots{display:flex;justify-content:center;gap:6px;margin:14px 0 0}.dots i{width:9px;height:9px;border-radius:50%;background:#b2bec3}.dots i.on{background:#6c5ce7;width:24px;border-radius:6px}
.exo{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}.exo span{background:#f1f2f6;border-radius:10px;padding:8px}
.sol{background:#fffbea;border:2px dashed #fdcb6e;border-radius:16px;padding:12px 14px;margin-top:12px;line-height:1.6;text-align:left;font-size:16px}
/* soru */
.qz{padding:10px 12px}
.qtop{display:flex;align-items:center;gap:10px}.qtop .bk{background:#fff;color:#636e72;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.pbar{flex:1;height:14px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.1)}.pbar i{display:block;height:100%;background:linear-gradient(90deg,#00b894,#55efc4);border-radius:10px;transition:width .4s}
.qn{font-size:15px;white-space:nowrap}
.qcard{position:relative;background:#fff;border-radius:24px;padding:16px 16px 14px;margin-top:12px;box-shadow:0 6px 18px rgba(0,0,0,.08);animation:pop .35s}
@keyframes pop{0%{transform:scale(.92);opacity:0}}
.qtag{display:inline-block;font-size:13px;font-weight:800;color:#6c5ce7;background:#efeaff;padding:4px 10px;border-radius:10px;margin-bottom:8px;max-width:calc(100% - 50px)}
.qq{font-size:20px;font-weight:700;line-height:1.5}
.qv{margin-top:10px;text-align:center;overflow-x:auto}
.spk{position:absolute;top:10px;right:10px;width:42px;height:42px;border-radius:50%;background:#ffeaa7;font-size:20px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opts.col{grid-template-columns:1fr}
.op{background:#fff;border-radius:18px;padding:14px 10px;font-size:21px;font-weight:800;min-height:62px;box-shadow:0 5px 0 #dfe6e9;border:3px solid #dfe6e9;line-height:1.3}
.opts.col .op{font-size:17px;text-align:left;padding:12px 14px}
.opts.svgo .op{padding:4px}.opts.svgo .op svg{max-height:130px}
.op.right{background:#d5f5e3;border-color:#00b894;box-shadow:0 5px 0 #00b894;animation:jump .4s}
.op.wrong{background:#fde2e2;border-color:#e74c3c;box-shadow:0 5px 0 #e74c3c;animation:shake .4s}
.op.gone{opacity:.25}
@keyframes jump{50%{transform:translateY(-6px) scale(1.04)}}@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.inb{display:flex;align-items:center;justify-content:center;min-height:62px;background:#fff;border:3px solid #a29bfe;border-radius:18px;margin-top:14px;font-size:32px;font-weight:900;letter-spacing:1px}
.inb.right{border-color:#00b894;background:#d5f5e3;animation:jump .4s}.inb.wrong{border-color:#e74c3c;background:#fde2e2;animation:shake .4s;font-size:26px}
.inb s{color:#e74c3c;margin-right:6px}
.cur{display:inline-block;width:3px;height:32px;background:#6c5ce7;margin-left:3px;animation:blink 1s infinite}@keyframes blink{50%{opacity:0}}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.kp button{background:#fff;border-radius:16px;padding:13px 0;font-size:26px;font-weight:900;box-shadow:0 5px 0 #dfe6e9}
.kp .del{background:#ffeaa7;box-shadow:0 5px 0 #e1c45a}.kp .okb{background:#00b894;color:#fff;box-shadow:0 5px 0 #00876a}
.tools{display:flex;gap:10px;justify-content:center;margin-top:14px}.tools button{background:#fff;border-radius:14px;padding:9px 14px;font-weight:800;font-size:15px;box-shadow:0 3px 0 #dfe6e9}.tools button:disabled{opacity:.4}
.hint{background:#fffbea;border-radius:16px;padding:12px 14px;margin-top:12px;border:2px solid #fdcb6e;animation:pop .3s}
/* overlay */
.ov{position:fixed;inset:0;background:rgba(45,52,54,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .2s}
@keyframes fade{0%{opacity:0}}
.ovb{background:#fff;border-radius:24px;padding:20px;width:100%;max-width:440px;max-height:88vh;overflow:auto;box-shadow:0 20px 40px rgba(0,0,0,.25);animation:pop .3s}
.ov.sheet{align-items:flex-end;padding:0;background:rgba(45,52,54,.25)}.ov.sheet .ovb{max-width:640px;border-radius:26px 26px 0 0;animation:up .3s}
@keyframes up{0%{transform:translateY(100%)}}
.fb{display:flex;align-items:center;gap:12px}.fb .mo{font-size:52px}.fb b{font-size:22px;display:block}.fb.ok b{color:#00b894}.fb.no b{color:#e74c3c;font-size:19px}.fb small{color:#636e72}
.ca{margin-top:4px;font-weight:700}.ca span{background:#d5f5e3;color:#00876a;border-radius:8px;padding:2px 8px;font-weight:900}
/* sonuç */
.res{padding:30px 18px;text-align:center}.rbig{font-size:84px;animation:pop .5s}.res h2{font-weight:900}
.rw{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:14px 0}.rw span{background:#fff;border-radius:14px;padding:8px 14px;font-weight:900;box-shadow:0 4px 10px rgba(0,0,0,.07)}
.col2{display:flex;flex-direction:column}
#toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-120px);background:#2d3436;color:#fff;padding:12px 18px;border-radius:16px;z-index:99;transition:transform .3s;font-weight:700;max-width:90%;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.25)}
#toast.on{transform:translate(-50%,0)}
.cf{position:fixed;inset:0;pointer-events:none;z-index:98}
/* mağaza, rozet */
.tabs{display:flex;background:#fff;border-radius:16px;padding:4px;gap:4px;margin-bottom:12px;box-shadow:0 3px 8px rgba(0,0,0,.06)}.tabs button{flex:1;padding:10px;border-radius:12px;font-weight:800}.tabs button.on{background:#6c5ce7;color:#fff}
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.si{background:#fff;border-radius:18px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 4px 10px rgba(0,0,0,.07);border:3px solid transparent}
.si.sel{border-color:#6c5ce7;background:#efeaff}.sa{font-size:44px}.si small{font-weight:800;color:#636e72}
.sw{width:64px;height:44px;border-radius:12px;border:2px solid #dfe6e9}
.bdg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.bi{background:#fff;border-radius:18px;padding:12px;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,.07)}.bi span{font-size:40px;display:block}.bi b{display:block}.bi small{color:#636e72;font-size:13px}.bi.lk{opacity:.45;filter:grayscale(1)}
.mi{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:14px;padding:10px 12px;margin:8px 0;font-size:15px}.mi span{font-size:22px}.mi svg{display:none}
/* ebeveyn */
.par h3{font-weight:900}.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.kpis div{background:#f1f2f6;border-radius:14px;padding:10px;text-align:center}.kpis b{font-size:24px;display:block;color:#6c5ce7}.kpis small{color:#636e72}
.mini{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:8px}.mini div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font-size:11px}.mini i{width:100%;background:linear-gradient(180deg,#a29bfe,#6c5ce7);border-radius:6px 6px 0 0}
.wr{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f1f2f6}.wr span{flex:1;font-size:15px}.wr b{color:#e74c3c}
details summary{cursor:pointer;padding:4px 0}.ptb{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}.ptb td,.ptb th{padding:6px 4px;border-bottom:1px solid #f1f2f6;text-align:left}.ptb tr.wk td{background:#fde2e2}
.tg{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f1f2f6;font-weight:700;font-size:15px}.tg i{width:52px;height:30px;border-radius:16px;background:#dfe6e9;position:relative;flex:0 0 52px;transition:.2s}.tg i::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 4px rgba(0,0,0,.2)}.tg i.on{background:#00b894}.tg i.on::after{left:25px}
.par label{display:block;font-weight:800;margin:12px 0 6px;font-size:15px}
/* görseller */
svg.vis{max-width:100%;height:auto;max-height:230px}
svg.vis text{font-family:"Segoe UI",Roboto,Arial,sans-serif;font-weight:800;text-anchor:middle;dominant-baseline:central;fill:#2d3436}
svg.clk{max-height:210px}
.multi svg.vis{max-width:47%;max-height:150px;display:inline-block;vertical-align:middle;margin:2px}
.pies{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.pies svg.sm{width:110px;height:110px}
.fr{display:inline-flex;align-items:center;gap:3px;vertical-align:middle;margin:0 3px}
.fr .fw{font-size:1.25em;font-weight:900}
.fn{display:inline-flex;flex-direction:column;align-items:center;line-height:1.05;font-weight:900}
.fn b{border-bottom:2.5px solid currentColor;padding:0 4px}.fn i{font-style:normal;padding:0 4px}
.op .fr,.exo .fr{font-size:1.05em}
.seq{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.seq span{min-width:52px;padding:10px 8px;border-radius:14px;background:#e8f4ff;font-size:20px;font-weight:900;text-align:center;border:2.5px solid #74b9ff}.seq span.q{background:#fff3e0;border-color:#e17055;color:#e17055}
.eg{line-height:1.35;font-size:24px;letter-spacing:2px;text-align:center}
.grps{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.g1{border:3px dashed #a29bfe;border-radius:50%;padding:12px;min-width:66px;min-height:66px;font-size:22px;max-width:120px;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;word-break:break-all}
.arr{display:inline-grid;gap:4px;font-size:22px}
.bigt{font-size:30px;font-weight:900;text-align:center;padding:8px;line-height:1.4}
.plus{font-size:30px;font-weight:900}
.colop{display:inline-block;font-family:"Courier New",monospace;font-size:30px;font-weight:900;text-align:right;letter-spacing:6px;background:#f8f9ff;padding:10px 18px;border-radius:16px}
.colop .cop{float:left;margin-right:14px;color:#e17055}.colop .ln{border-top:3px solid #2d3436;margin-top:4px;color:#6c5ce7}
.divop{display:inline-grid;grid-template-columns:auto auto;font-family:"Courier New",monospace;font-size:28px;font-weight:900;background:#f8f9ff;padding:10px 16px;border-radius:16px;text-align:left}
.divop .dd{padding:2px 12px 2px 4px}.divop .dv{border-left:3px solid #2d3436;border-bottom:3px solid #2d3436;padding:2px 10px}.divop .dq{grid-column:2;padding:2px 10px;color:#6c5ce7}.divop .dr{grid-column:1/3;font-size:16px;font-family:inherit;color:#e17055}
table.pt{margin:8px auto;border-collapse:separate;border-spacing:4px}table.pt th{font-size:12px;background:#efeaff;border-radius:8px;padding:4px 6px}table.pt td{font-size:26px;font-weight:900;text-align:center;background:#fff;border:2.5px solid #a29bfe;border-radius:10px;padding:4px}table.pt .hl{background:#ffeaa7;border-color:#fdcb6e}

<script>// ===== Yardımcılar =====
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const P=a=>a[Math.floor(Math.random()*a.length)];
const SH=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a};
const F=n=>{n=Number(n);return Math.abs(n)>=10000?String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.'):String(n)};
const ONES=['','bir','iki','üç','dört','beş','altı','yedi','sekiz','dokuz'];
const TENS=['','on','yirmi','otuz','kırk','elli','altmış','yetmiş','seksen','doksan'];
function W3(n){const h=Math.floor(n/100),t=Math.floor(n%100/10),o=n%10,p=[];if(h)p.push(h>1?ONES[h]+' yüz':'yüz');if(t)p.push(TENS[t]);if(o)p.push(ONES[o]);return p.join(' ')}
function words(n){if(n===0)return 'sıfır';const p=[],m=Math.floor(n/1e6),th=Math.floor(n%1e6/1000),r=n%1000;if(m)p.push(W3(m)+' milyon');if(th)p.push(th>1?W3(th)+' bin':'bin');if(r)p.push(W3(r));return p.join(' ')}
const EK={bir:['in','i','e','de'],iki:['nin','yi','ye','de'],'üç':['ün','ü','e','te'],'dört':['ün','ü','e','te'],'beş':['in','i','e','te'],'altı':['nın','yı','ya','da'],yedi:['nin','yi','ye','de'],sekiz:['in','i','e','de'],dokuz:['un','u','a','da'],on:['un','u','a','da'],yirmi:['nin','yi','ye','de'],otuz:['un','u','a','da'],'kırk':['ın','ı','a','ta'],elli:['nin','yi','ye','de'],'altmış':['ın','ı','a','ta'],'yetmiş':['in','i','e','te'],seksen:['in','i','e','de'],doksan:['ın','ı','a','da'],'yüz':['ün','ü','e','de'],bin:['in','i','e','de'],milyon:['un','u','a','da'],'sıfır':['ın','ı','a','da']};
function ek(n,k){const w=words(n).split(' ').pop();return EK[w][{gen:0,acc:1,dat:2,loc:3}[k]]}
const nk=(n,k)=>F(n)+"'"+ek(n,k);
const fw=(n,d)=>words(d)+ek(d,'loc')+' '+words(n);
const FR=(n,d,w)=>`<span class="fr" data-s="${(w?words(w)+' tam ':'')+fw(n,d)}">${w?'<span class="fw">'+w+'</span>':''}<span class="fn"><b>${n}</b><i>${d}</i></span></span>`;
const DIST={1:'birer',2:'ikişer',3:'üçer',4:'dörder',5:'beşer',6:'altışar',7:'yedişer',8:'sekizer',9:'dokuzar',10:'onar'};
const KIS=[['Elif',"Elif'in","Elif'e","Elif'ten"],['Ali',"Ali'nin","Ali'ye","Ali'den"],['Mert',"Mert'in","Mert'e","Mert'ten"],['Ayşe',"Ayşe'nin","Ayşe'ye","Ayşe'den"],['Zeynep',"Zeynep'in","Zeynep'e","Zeynep'ten"],['Can',"Can'ın","Can'a","Can'dan"],['Deniz',"Deniz'in","Deniz'e","Deniz'den"],['Ece',"Ece'nin","Ece'ye","Ece'den"],['Emir',"Emir'in","Emir'e","Emir'den"],['Defne',"Defne'nin","Defne'ye","Defne'den"],['Ömer',"Ömer'in","Ömer'e","Ömer'den"],['Yusuf',"Yusuf'un","Yusuf'a","Yusuf'tan"],['Asel',"Asel'in","Asel'e","Asel'den"],['Kerem',"Kerem'in","Kerem'e","Kerem'den"]];
const ESY=[['bilye','bilyesi','🔮'],['kalem','kalemi','✏️'],['elma','elması','🍎'],['çıkartma','çıkartması','⭐'],['kitap','kitabı','📕'],['boncuk','boncuğu','📿'],['misket','misketi','🟢'],['balon','balonu','🎈'],['kurabiye','kurabiyesi','🍪'],['kart','kartı','🃏'],['şeker','şekeri','🍬'],['oyuncak araba','oyuncak arabası','🚗']];
const two=()=>{const a=SH(KIS);return [a[0],a[1]]};
const COLS=['#ff7675','#74b9ff','#55efc4','#fdcb6e','#a29bfe','#fd79a8','#81ecec','#fab1a0'];

// Soru kurucular
function MC(q,a,ds,x){a=String(a);let o=[a];for(const d of ds){const s=String(d);if(!o.includes(s)&&o.length<4)o.push(s)}if(!(x&&x.keep))o=SH(o);const r=Object.assign({q,t:'mc',o},x||{});r.ai=o.indexOf(a);delete r.keep;return r}
function MCF(q,o,ai,x){return Object.assign({q,t:'mc',o,ai},x||{})}
function NUM(q,a,x){return Object.assign({q,t:'num',a:String(a)},x||{})}
function CMP(q,a,b,x){const s=a<b?'<':a>b?'>':'=';return MCF(q,['<','=','>'],['<','=','>'].indexOf(s),x)}
function ND(a,extra,big){const st=big||(a>=1000?100:a>=100?10:1);let c=(extra||[]).concat(SH([a+st,a-st,a+1,a-1,a+2*st,a-2*st]),[a+3,a-3,a+5,a+10,a+11]);const out=[];for(const x of c){if(Number.isInteger(x)&&x>=0&&x!==a&&!out.includes(x))out.push(x);if(out.length===3)break}return out}
const sw=n=>Number(String(n).split('').reverse().join(''));

// Basit HTML görselleri
const seqH=a=>`<div class="seq">${a.map(x=>`<span class="${x==='?'?'q':''}">${x}</span>`).join('')}</div>`;
const eg=(n,e,per=10)=>{let s='<div class="eg">';for(let i=0;i<n;i++){s+=`<span>${e}</span>`;if((i+1)%per===0&&i<n-1)s+='<br>'}return s+'</div>'};
const grp=(g,per,e)=>`<div class="grps">${Array.from({length:g},()=>`<div class="g1">${e.repeat(per)||'&nbsp;'}</div>`).join('')}</div>`;
const arr=(r,c,e)=>`<div class="arr" style="grid-template-columns:repeat(${c},auto)">${`<span>${e}</span>`.repeat(r*c)}</div>`;
const big=t=>`<div class="bigt">${t}</div>`;
function col(a,b,op,res){return `<div class="colop"><div>${a}</div><div><span class="cop">${op}</span>${b}</div><div class="ln">${res===undefined?'?':res}</div></div>`}
function divop(a,b,q,r){return `<div class="divop"><div class="dd">${a}</div><div class="dv">${b}</div><div class="dq">${q===undefined?'?':q}</div>${r!==undefined?`<div class="dr">Kalan: ${r}</div>`:''}</div>`}
function ptable(n,cols,hl){const ds=String(n).padStart(cols.length,'0').split('');return `<table class="pt"><tr>${cols.map((c,i)=>`<th class="${i===hl?'hl':''}">${c}</th>`).join('')}</tr><tr>${ds.map((d,i)=>`<td class="${i===hl?'hl':''}">${d}</td>`).join('')}</tr></table>`}
const BAS=['Birler','Onlar','Yüzler','Binler','On binler','Yüz binler'];

// Çözüm adımları
function addSol(a,b){const A=String(a).split('').reverse().map(Number),B=String(b).split('').reverse().map(Number);let c=0;const st=[];for(let i=0;i<Math.max(A.length,B.length);i++){const x=A[i]||0,y=B[i]||0,s=x+y+c;st.push(`${BAS[i]}: ${x} + ${y}${c?' + 1 (elde)':''} = ${s}${s>9?` → ${s%10} yaz, 1 elde`:''}`);c=s>9?1:0}if(c)st.push('Eldeki 1 en sola yazılır.');return st.join('<br>')+`<br><b>Sonuç: ${F(a+b)}</b>`}
function subSol(a,b){const A=String(a).split('').reverse().map(Number),B=String(b).split('').reverse().map(Number);let br=0;const st=[];for(let i=0;i<A.length;i++){let x=A[i]-br;const y=B[i]||0;const gave=br;br=0;let note='';if(x<y){x+=10;br=1;note=' (soldan 1 bozduk)'}if(i===A.length-1&&x===0&&!y)break;st.push(`${BAS[i]}: ${x} − ${y} = ${x-y}${note}${gave&&!note?' (1 verdi)':''}`)}return st.join('<br>')+`<br><b>Sonuç: ${F(a-b)}</b>`}
function mulSol(a,b){if(b<10){const A=String(a).split('').reverse().map(Number);let c=0;const st=[];A.forEach((x,i)=>{const p=x*b+c;st.push(`${BAS[i]}: ${x} × ${b}${c?' + '+c+' (elde)':''} = ${p}${p>9&&i<A.length-1?` → ${p%10} yaz, ${Math.floor(p/10)} elde`:''}`);c=Math.floor(p/10)});return st.join('<br>')+`<br><b>Sonuç: ${F(a*b)}</b>`}
const o=b%10,t=Math.floor(b/10);if(!o)return `${F(a)} × ${t} = ${F(a*t)}<br>10 ile çarptığımız için sağına bir 0 ekle → <b>${F(a*b)}</b>`;return `${F(a)} × ${o} = ${F(a*o)}<br>${F(a)} × ${t*10} = ${F(a*t*10)}<br>${F(a*o)} + ${F(a*t*10)} = <b>${F(a*b)}</b>`}

// ===== SVG görselleri =====
const S=(w,h,b,c)=>`<svg class="vis ${c||''}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${b}</svg>`;
const T=(x,y,t,o)=>`<text x="${x}" y="${y}" ${o||''}>${t}</text>`;
const STK='stroke="#2d3436" stroke-width="3" stroke-linejoin="round"';
function blocks(n){const h=Math.floor(n/100),t=Math.floor(n%100/10),o=n%10;let x=6,s='';
for(let i=0;i<h;i++){s+=`<rect x="${x}" y="6" width="70" height="70" rx="2" fill="#ff9fb3" stroke="#d6456a" stroke-width="1.5"/>`;let g='';for(let k=1;k<10;k++)g+=`M${x+k*7} 6v70M${x} ${6+k*7}h70`;s+=`<path d="${g}" stroke="#d6456a" stroke-width=".6"/>`;x+=78}
for(let i=0;i<t;i++){s+=`<rect x="${x}" y="6" width="8" height="70" fill="#74b9ff" stroke="#0a6bc7" stroke-width="1.2"/>`;let g='';for(let k=1;k<10;k++)g+=`M${x} ${6+k*7}h8`;s+=`<path d="${g}" stroke="#0a6bc7" stroke-width=".6"/>`;x+=12}
if(t)x+=6;for(let i=0;i<o;i++){const c=Math.floor(i/5),r=i%5;s+=`<rect x="${x+c*12}" y="${16+r*12}" width="10" height="10" rx="1" fill="#ffd166" stroke="#c99400"/>`}
return S(Math.max(x+(o?Math.ceil(o/5)*12:0)+6,40),82,s)}
function nline(a,b,step,o={}){const n=Math.round((b-a)/step),W=Math.max(320,n*34+40),X=v=>20+(v-a)/(b-a)*(W-40);let s=`<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#6c5ce7"/></marker></defs><path d="M8 55H${W-8}" stroke="#555" stroke-width="2.5"/>`;
for(let i=0;i<=n;i++){const v=a+i*step,x=X(v),mj=o.major?((v-a)%o.major===0):true;s+=`<path d="M${x} ${mj?44:48}V${mj?66:62}" stroke="#555" stroke-width="2"/>`;const l=o.lab?o.lab(v):(mj?v:null);if(l!==null&&l!==undefined)s+=T(x,80,l,l==='?'?'fill="#e17055" font-size="18"':'font-size="13"')}
if(o.jumps)for(const [p,q] of o.jumps){const x1=X(p),x2=X(q),m=(x1+x2)/2;s+=`<path d="M${x1} 46Q${m} 12 ${x2} 46" fill="none" stroke="#6c5ce7" stroke-width="2.5" marker-end="url(#ar)"/>`}
if(o.hl!==undefined){const x=X(o.hl);s+=`<circle cx="${x}" cy="55" r="7" fill="#e17055"/>`+(o.hlab!==undefined?T(x,30,o.hlab,'fill="#e17055" font-size="16"'):'')}
return S(W,90,s)}
function clock(h,m){let s=`<circle cx="100" cy="100" r="92" fill="#fff" stroke="#6c5ce7" stroke-width="8"/>`;let g='',g2='';for(let i=0;i<60;i++){const a=i*Math.PI/30,r1=i%5?82:75;const d=`M${(100+r1*Math.sin(a)).toFixed(1)} ${(100-r1*Math.cos(a)).toFixed(1)}L${(100+87*Math.sin(a)).toFixed(1)} ${(100-87*Math.cos(a)).toFixed(1)}`;if(i%5)g+=d;else g2+=d}s+=`<path d="${g}" stroke="#999" stroke-width="1.2"/><path d="${g2}" stroke="#333" stroke-width="3"/>`;
for(let i=1;i<=12;i++){const a=i*Math.PI/6;s+=T((100+62*Math.sin(a)).toFixed(1),(101-62*Math.cos(a)).toFixed(1),i,'font-size="19"')}
const ha=((h%12)+m/60)*Math.PI/6,ma=m*Math.PI/30;s+=`<path d="M100 100L${(100+44*Math.sin(ha)).toFixed(1)} ${(100-44*Math.cos(ha)).toFixed(1)}" stroke="#2d3436" stroke-width="8" stroke-linecap="round"/><path d="M100 100L${(100+72*Math.sin(ma)).toFixed(1)} ${(100-72*Math.cos(ma)).toFixed(1)}" stroke="#e17055" stroke-width="4.5" stroke-linecap="round"/><circle cx="100" cy="100" r="6" fill="#2d3436"/>`;return S(200,200,s,'clk')}
const ACC=['','1\'i','2\'yi','3\'ü','4\'ü','5\'i','6\'yı','7\'yi','8\'i','9\'u','10\'u','11\'i','12\'yi'];
const DAT=['','1\'e','2\'ye','3\'e','4\'e','5\'e','6\'ya','7\'ye','8\'e','9\'a','10\'a','11\'e','12\'ye'];
function saatSoz(h,m){h=((h-1)%12+12)%12+1;const nx=h%12+1;if(m===0)return `Saat tam ${h}`;if(m===30)return `Saat ${h} buçuk`;if(m===15)return `Saat ${ACC[h]} çeyrek geçiyor`;if(m===45)return `Saat ${DAT[nx]} çeyrek var`;if(m<30)return `Saat ${ACC[h]} ${m} geçiyor`;return `Saat ${DAT[nx]} ${60-m} var`}
const hhmm=(h,m)=>String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
function pie(d,k,c,sz){c=c||'#fd79a8';const r=78;let s='';if(d===1)s=`<circle cx="90" cy="90" r="${r}" fill="${k?c:'#fff'}" ${STK}/>`;else for(let i=0;i<d;i++){const a1=i/d*2*Math.PI-Math.PI/2,a2=(i+1)/d*2*Math.PI-Math.PI/2;s+=`<path d="M90 90L${(90+r*Math.cos(a1)).toFixed(1)} ${(90+r*Math.sin(a1)).toFixed(1)}A${r} ${r} 0 0 1 ${(90+r*Math.cos(a2)).toFixed(1)} ${(90+r*Math.sin(a2)).toFixed(1)}Z" fill="${i<k?c:'#fff'}" stroke="#2d3436" stroke-width="2.5" data-i="${i}"/>`}return S(180,180,s,sz||'')}
function pies(n,d,c){let s='';const k=Math.max(1,Math.ceil(n/d));for(let j=0;j<k;j++)s+=pie(d,Math.min(d,Math.max(0,n-j*d)),c,'sm');return `<div class="pies">${s}</div>`}
function fbar(d,k,c,w){c=c||'#74b9ff';w=w||300;const cw=w/d;let s='';for(let i=0;i<d;i++)s+=`<rect x="${(4+i*cw).toFixed(1)}" y="4" width="${cw.toFixed(1)}" height="50" fill="${i<k?c:'#fff'}" stroke="#2d3436" stroke-width="2.5"/>`;return S(w+8,58,s)}

function rom(n){const t=[[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let s='';for(const [v,r] of t)while(n>=v){s+=r;n-=v}return s}
function divSol(a,b){const D=String(a).split('').map(Number);let r=0,q='';const st=[];for(let i=0;i<D.length;i++){const cur=r*10+D[i];if(q===''&&cur<b&&i<D.length-1){r=cur;continue}const k=Math.floor(cur/b);st.push(`${nk(cur,'gen')} içinde ${b}, <b>${k}</b> kez var. ${k} × ${b} = ${k*b}, ${cur} − ${k*b} = ${cur-k*b}`);q+=k;r=cur-k*b}return st.join('<br>')+`<br>Bölüm: <b>${Number(q)}</b>${r?`, Kalan: <b>${r}</b>`:''}`}
const POSS=['','biri','ikisi','üçü','dördü','beşi','altısı','yedisi','sekizi','dokuzu'];

 <div class="qcard"><div class="qtag">${t.i} ${t.t}${m==='exam'?' · ⭐ Sınav':m==='mixed'?' · 🎯 Deneme':m==='mist'?' · 📒 Tekrar':''}</div><div class="qq">${q.q}</div>${q.v?`<div class="qv">${q.v}</div>`:''}<button class="spk" onclick="say(QZ.q.q)">🔊</button></div>
 <div id="ans">${q.t==='mc'?`<div class="opts ${hasSvgOpt?'svgo':longOpt?'col':''}">${q.o.map((o,i)=>`<button class="op" id="op${i}" onclick="submitA(${i})">${o}</button>`).join('')}</div>`:`<div class="inb" id="inb"><span id="inv"></span><i class="cur"></i></div><div class="kp">${[1,2,3,4,5,6,7,8,9].map(k=>`<button onclick="kp('${k}')">${k}</button>`).join('')}<button class="del" onclick="kp('d')">⌫</button><button onclick="kp('0')">0</button><button class="okb" onclick="kp('ok')">✔</button></div>`}</div>
 ${m==='practice'||m==='mist'?`<div class="tools"><button onclick="hint()">💡 İpucu</button>${q.t==='mc'&&q.o.length>2?`<button id="fifty" onclick="fifty()">✂️ Yarı yarıya</button>`:''}</div>`:''}<div id="hb"></div></div>`);
 BACKGUARD=()=>{confirmOv('Çıkmak istiyor musun?','Bu tur yarıda kalacak. Yıldız ve tur ödülü verilmez.',()=>{if(QZ&&QZ.timer)clearInterval(QZ.timer);QZ=null;BACKGUARD=null;back()},'Çık');return true};

 const weak=Object.keys(ST.stat).filter(id=>TOP[id]).map(id=>({id,a:acc(id),n:ST.stat[id].c+ST.stat[id].w})).filter(x=>x.n>=8&&x.a<70).sort((a,b)=>a.a-b.a).slice(0,5);
 const tg=t=>{const a=acc(t.id),s=ST.stat[t.id];return `<tr class="${a!==null&&a<70&&s.c+s.w>=8?'wk':''}"><td>${t.i} ${t.t}</td><td>${'★'.repeat(ST.stars[t.id]||0)||'—'}</td><td>${a===null?'—':'%'+a}</td><td>${s?s.c+s.w:0}</td></tr>`};
 show(`${bar('👨‍👩‍👧 Ebeveyn Paneli','linear-gradient(135deg,#636e72,#2d3436)')}<div class="pad par">
 <div class="card"><h3>📈 Özet</h3><div class="kpis"><div><b>${tq}</b><small>Toplam soru</small></div><div><b>%${ac}</b><small>Doğruluk</small></div><div><b>${ST.streak.best}</b><small>En uzun seri (gün)</small></div><div><b>${[2,3,4].reduce((a,g)=>a+starsOf(g),0)}</b><small>Toplam yıldız</small></div></div>
 <h4>Son 7 gün (dakika)</h4><div class="mini">${days.map(d=>`<div><i style="height:${Math.max(3,70*d[1]/mxm)}px"></i><small>${d[1]}</small><b>${d[0]}</b></div>`).join('')}</div></div>
 <div class="card"><h3>⚠️ Desteklenmesi Gereken Konular</h3>${weak.length?weak.map(w=>`<div class="wr"><span>${TOP[w.id].i} ${TOP[w.id].t} <small>(${GRADES[TOP[w.id].g_].n})</small></span><b>%${w.a}</b><button class="btn sm pr" onclick="startQuiz('practice','${w.id}')">Çalış</button></div>`).join(''):'<p class="muted">Henüz zorlanılan bir konu yok (en az 8 soru çözülmüş ve doğruluğu %70 altında olan konular burada görünür).</p>'}</div>
 ${[2,3,4].map(g=>`<details class="card"><summary><b>${GRADES[g].e} ${GRADES[g].n}</b> · ⭐ ${starsOf(g)}/${GRADES[g].T.length*3}</summary><table class="ptb"><tr><th>Konu</th><th>Yıldız</th><th>Doğruluk</th><th>Soru</th></tr>${GRADES[g].T.map(tg).join('')}</table></details>`).join('')}
 <div class="card"><h3>⚙️ Ayarlar</h3><label>Çocuğun adı</label><input id="pn" value="${esc(ST.name)}" maxlength="14" onchange="ST.name=this.value.trim()||ST.name;save()">
 <label>Sınıf</label><div class="row">${[2,3,4].map(g=>`<button class="btn sm ${ST.grade===g?'pr':'gr'}" onclick="ST.grade=${g};save();swap(scrParent)">${g}. Sınıf</button>`).join('')}</div>
 <label>Günlük hedef (doğru cevap)</label><div class="row">${[10,20,30,50].map(n=>`<button class="btn sm ${ST.goal===n?'pr':'gr'}" onclick="ST.goal=${n};save();swap(scrParent)">${n}</button>`).join('')}</div>
 ${[['snd','🔈 Ses efektleri'],['tts','🔊 Sesli okuma düğmesi'],['auto','🗣️ Soruları otomatik sesli oku'],['unlock','🔓 Tüm konuları aç (sıralı ilerlemeyi kapat)']].map(([k,n])=>`<div class="tg" onclick="ST.${k}=ST.${k}?0:1;save();swap(scrParent)"><span>${n}</span><i class="${ST[k]?'on':''}"></i></div>`).join('')}
 <button class="btn no" style="margin-top:14px" onclick="confirmOv('Tüm ilerleme silinsin mi?','Yıldızlar, altınlar, rozetler ve istatistikler sıfırlanır. Bu işlem geri alınamaz.',()=>{localStorage.removeItem(KEY);ST=defST();applyTheme();NAV=[];go(scrWelcome)},'Sıfırla')">♻️ İlerlemeyi sıfırla</button></div>
 <p class="muted cen">Matematik Adaları, MEB ilkokul 2-3-4. sınıf matematik dersi öğretim programındaki sayılar ve işlemler, geometri, ölçme ve veri işleme öğrenme alanlarını kapsar. Sorular her seferinde yeniden üretilir; aynı test iki kez gelmez.</p></div>`)}

// --- Başlat ---
window.addEventListener('load',()=>{applyTheme();if(ST.name)home();else{NAV=[];go(scrWelcome)}setInterval(()=>{if(document.hidden)return;const d=today();ST.mins[d]=(ST.mins[d]||0)+1;const ks=Object.keys(ST.mins).sort();while(ks.length>40)delete ST.mins[ks.shift()];save()},60000)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')back()});

// ===== Oyun Parkı =====
let GG=null;
function quickQ(g){const k=R(0,3);let q,a;
 if(g===2){if(k===0){const x=R(10,80),y=R(2,19);q=`${x} + ${y}`;a=x+y}else if(k===1){const x=R(25,99),y=R(2,19);q=`${x} − ${y}`;a=x-y}else{const x=R(2,5),y=R(1,10);q=`${x} × ${y}`;a=x*y}}
 else if(g===3){if(k===0){const x=R(10,80)*10,y=R(1,9)*10;q=`${x} + ${y}`;a=x+y}else if(k===1){const x=R(2,10),y=R(2,10);q=`${x} × ${y}`;a=x*y}else if(k===2){const y=R(2,9),z=R(2,10);q=`${y*z} ÷ ${y}`;a=z}else{const x=R(200,999),y=R(1,9)*10;q=`${x} − ${y}`;a=x-y}}
 else{if(k===0){const x=R(11,30),y=R(3,9);q=`${x} × ${y}`;a=x*y}else if(k===1){const y=R(3,9),z=R(11,25);q=`${y*z} ÷ ${y}`;a=z}else if(k===2){const x=R(12,99),t=P([10,100]);q=`${x} × ${t}`;a=x*t}else{const x=R(20,90)*100,y=R(11,99)*10;q=`${x} − ${y}`;a=x-y}}
 const ds=ND(a,SH([a+1,a-1,a+10,a-10,a+2]));return {q,a,o:SH([a,...ds])}}
function scrGames(){if(!window._gg)window._gg=ST.grade;const GM=[['balon','🎈','Balon Patlat','Doğru cevabın balonunu patlat! 60 saniye.','#ff7675'],['hiz','⚡','Hızlı Hesap','Klavyeyle cevapla, seriyi büyüt!','#fdcb6e'],['roket','🚀','Roket Yarışı','Robottan önce Ay\'a ulaş!','#74b9ff'],['dy','✅','Doğru mu Yanlış mı?','İşlem doğru mu? Çabuk karar ver!','#55efc4'],['hafiza','🃏','Hafıza Kartları','İşlemi sonucuyla eşleştir.','#a29bfe']];
 show(`${bar('🎮 Oyun Parkı','linear-gradient(135deg,#fd79a8,#e84393)')}<div class="pad"><div class="tabs">${[2,3,4].map(g=>`<button class="${_gg===g?'on':''}" onclick="_gg=${g};swap(scrGames)">${g}. Sınıf</button>`).join('')}</div>
 ${GM.map(([k,e,n,d,c])=>`<button class="gcard" style="border-color:${c}" onclick="startGame('${k}')"><span style="background:${c}">${e}</span><div><b>${n}</b><small>${d}</small></div>${ST.gbest[k+_gg]?`<em>🏆 ${ST.gbest[k+_gg]}</em>`:''}</button>`).join('')}</div>`)}
function startGame(k){ST.games++;save();checkBadges();go({balon:gBalon,hiz:gHiz,roket:gRoket,dy:gDY,hafiza:gHafiza}[k])}
function gTop(t){return `<div class="gtop"><button class="bk" onclick="back()">✕</button><b>${t}</b><span id="gt"></span><span id="gs">⭐ 0</span></div>`}
function gameOver(k,score,txt){const key=k+_gg,rec=score>(ST.gbest[key]||0);if(rec)ST.gbest[key]=score;const c=Math.max(1,Math.floor(score/(k==='hafiza'||k==='roket'?1:2)));ST.coins+=c;save();checkBadges();if(rec||score>=10){confetti();SFX.win()}
 ov(`<div class="cen"><div class="rbig">${rec?'🏆':'🎉'}</div><h3>${txt||('Puan: '+score)}</h3>${rec?'<p><b>Yeni rekor!</b></p>':`<p>Rekor: ${ST.gbest[key]}</p>`}<p>💰 +${c}</p><div class="row"><button class="btn gr" onclick="closeOv();back()">Çık</button><button class="btn pr" onclick="closeOv();swap(${{balon:'gBalon',hiz:'gHiz',roket:'gRoket',dy:'gDY',hafiza:'gHafiza'}[k]})">Tekrar 🔁</button></div></div>`,'lock')}
function timerG(sec,onEnd){GG.time=sec;$('#gt').textContent='⏱ '+sec;GG.iv=setInterval(()=>{GG.time--;const e=$('#gt');if(e)e.textContent='⏱ '+Math.max(0,GG.time);if(GG.time<=0){clearInterval(GG.iv);GG.over=1;onEnd()}},1000);CLEAN=()=>{clearInterval(GG.iv);if(GG.iv2)clearInterval(GG.iv2);GG.over=1}}
const setS=()=>{const e=$('#gs');if(e)e.textContent='⭐ '+GG.score};

function gBalon(){GG={score:0};show(`<div class="game">${gTop('🎈 Balon Patlat')}<div class="gq" id="gq"></div><div class="arena" id="ar"></div></div>`);timerG(60,()=>gameOver('balon',GG.score));wave()}
function wave(){if(!GG||GG.over)return;const q=quickQ(_gg);GG.q=q;$('#gq').textContent=q.q+' = ?';const ar=$('#ar');ar.innerHTML='';const xs=SH([2,27,52,77]),dur=Math.max(4.2,7.5-GG.score*.15);
 q.o.forEach((o,i)=>{const b=document.createElement('button');b.className='bal';b.style.left=xs[i]+'%';b.style.background=COLS[R(0,7)];b.style.animationDuration=(dur+Math.random()*1.2)+'s';b.innerHTML=`<span>${F(o)}</span>`;b.onclick=()=>{if(b.dataset.x)return;if(o===q.a){b.dataset.x=1;b.classList.add('pop');SFX.pop();GG.score++;setS();setTimeout(wave,260)}else{b.classList.add('shake');SFX.no();GG.time=Math.max(1,GG.time-3);toast('−3 saniye')}};if(o===q.a)b.addEventListener('animationend',e=>{if(e.animationName==='rise'&&!b.dataset.x&&GG.q===q)wave()});ar.appendChild(b)})}

function gHiz(){GG={score:0,combo:0,inp:''};show(`<div class="game">${gTop('⚡ Hızlı Hesap')}<div class="gq big2" id="gq"></div><div class="inb" id="inb"><span id="inv"></span><i class="cur"></i></div><div id="cmb" class="cmb"></div><div class="kp">${[1,2,3,4,5,6,7,8,9].map(k=>`<button onclick="hk('${k}')">${k}</button>`).join('')}<button class="del" onclick="hk('d')">⌫</button><button onclick="hk('0')">0</button><button class="okb" onclick="hk('ok')">✔</button></div></div>`);timerG(60,()=>gameOver('hiz',GG.score));hq()}
function hq(){GG.q=quickQ(_gg);GG.inp='';$('#gq').textContent=GG.q.q+' = ?';$('#inv').textContent='';$('#inb').className='inb'}
function hk(k){if(!GG||GG.over)return;SFX.tap();if(k==='d')GG.inp=GG.inp.slice(0,-1);else if(k!=='ok'&&GG.inp.length<6)GG.inp+=k;$('#inv').textContent=GG.inp;const A=String(GG.q.a);if(k==='ok'||GG.inp.length>=A.length){if(GG.inp===A){GG.score++;GG.combo++;SFX.ok();$('#inb').className='inb right';if(GG.combo>=3)$('#cmb').textContent=`🔥 ${GG.combo} seri!`;if(GG.combo%5===0){GG.time+=3;toast('🔥 Seri bonusu: +3 saniye')}setS();setTimeout(hq,220)}else if(k==='ok'||GG.inp.length>=A.length){GG.combo=0;$('#cmb').textContent='';SFX.no();$('#inb').className='inb wrong';$('#inv').innerHTML=`<s>${GG.inp}</s> → ${A}`;GG.inp='';setTimeout(hq,700)}}}

function gRoket(){GG={me:0,bot:0,score:0};const sp={2:5200,3:4600,4:4200}[_gg];show(`<div class="game">${gTop('🚀 Roket Yarışı')}<div class="track"><div class="ln"><span id="rme" class="rk">🚀</span><em>🌕</em></div><div class="ln"><span id="rbt" class="rk">🛸</span><em>🌕</em></div></div><div class="gq" id="gq"></div><div class="opts" id="ro"></div></div>`);
 $('#gt').textContent='Sen 🚀 vs 🛸 Robot';GG.iv=setInterval(()=>{if(GG.over)return;GG.bot++;mv();if(GG.bot>=10)endR(false)},sp);CLEAN=()=>{clearInterval(GG.iv);GG.over=1};rq()}
function mv(){$('#rme').style.left=(GG.me*8.5)+'%';$('#rbt').style.left=(GG.bot*8.5)+'%'}
function rq(){const q=quickQ(_gg);GG.q=q;$('#gq').textContent=q.q+' = ?';$('#ro').innerHTML=q.o.map((o,i)=>`<button class="op" onclick="ra(${o},this)">${F(o)}</button>`).join('')}
function ra(o,b){if(GG.over)return;if(o===GG.q.a){SFX.ok();GG.me++;GG.score++;setS();mv();if(GG.me>=10){endR(true);return}rq()}else{SFX.no();b.classList.add('wrong');b.disabled=true}}
function endR(w){GG.over=1;clearInterval(GG.iv);gameOver('roket',w?20:5,w?'Kazandın! 🚀🌕':'Robot kazandı 🛸 Tekrar dene!')}

function gDY(){GG={score:0};show(`<div class="game">${gTop('✅ Doğru mu Yanlış mı?')}<div class="gq big2" id="gq"></div><div class="row dy"><button class="btn ok big" onclick="dya(1)">✅ Doğru</button><button class="btn no big" onclick="dya(0)">❌ Yanlış</button></div></div>`);timerG(45,()=>gameOver('dy',GG.score));dyq()}
function dyq(){const q=quickQ(_gg),t=R(0,1),shown=t?q.a:P(q.o.filter(x=>x!==q.a));GG.t=t;const e=$('#gq');e.textContent=`${q.q} = ${F(shown)}`;e.className='gq big2'}
function dya(v){if(GG.over)return;const e=$('#gq');if(v===GG.t){GG.score++;SFX.ok();setS();e.className='gq big2 okf'}else{SFX.no();GG.time=Math.max(1,GG.time-2);e.className='gq big2 nof'}setTimeout(dyq,280)}

function gHafiza(){GG={moves:0,open:[],done:0,score:0};const pairs=[],seen=new Set();while(pairs.length<6){const q=quickQ(_gg);if(!seen.has(q.a)){seen.add(q.a);pairs.push(q)}}const cards=SH(pairs.flatMap((q,i)=>[{p:i,t:q.q},{p:i,t:F(q.a)}]));GG.cards=cards;
 show(`<div class="game">${gTop('🃏 Hafıza Kartları')}<p class="cen muted">İşlemi sonucuyla eşleştir!</p><div class="mem">${cards.map((c,i)=>`<button class="mc" id="mc${i}" onclick="mf(${i})"><span>${c.t}</span></button>`).join('')}</div></div>`);$('#gt').textContent='Hamle: 0';CLEAN=()=>{GG.over=1}}
function mf(i){const c=GG.cards[i],b=$('#mc'+i);if(GG.over||GG.lock||b.classList.contains('up'))return;b.classList.add('up');SFX.tap();GG.open.push(i);if(GG.open.length<2)return;GG.moves++;$('#gt').textContent='Hamle: '+GG.moves;const [a,d]=GG.open;GG.open=[];
 if(GG.cards[a].p===GG.cards[d].p){SFX.ok();setTimeout(()=>{$('#mc'+a).classList.add('ok');$('#mc'+d).classList.add('ok')},200);if(++GG.done===6){GG.score=Math.max(5,30-GG.moves);setS();setTimeout(()=>gameOver('hafiza',GG.score,`${GG.moves} hamlede bitirdin!`),600)}}else{GG.lock=1;setTimeout(()=>{$('#mc'+a).classList.remove('up');$('#mc'+d).classList.remove('up');GG.lock=0},800)}}

// ===== Laboratuvar =====
function scrLab(){window._labk=null;const L=[['blok','🧱','Onluk Blokları','Sayıları bloklarla kur'],['saat','⏰','Saat Ustası','Akrep ve yelkovanı oynat'],['kesir','🍕','Kesir Yapıcı','Dilimleri boya, kesri gör'],['dizi','🔵','Çarpma Dizisi','Satır × sütun = çarpım'],['aci','📐','Açı Ölçer','Açıyı aç, türünü öğren'],['tablo','🧮','Çarpım Tablosu','Kutulara dokun, keşfet']];
 show(`${bar('🔬 Matematik Laboratuvarı','linear-gradient(135deg,#00cec9,#0984e3)')}<div class="pad"><p class="cen muted">Burada soru yok, sadece keşif var! Dokun, değiştir, gözlemle. 🔍</p><div class="tiles">${L.map(([k,e,n,d])=>`<button class="tile lab" onclick="go(lab,'${k}')"><span>${e}</span><b>${n}</b><small>${d}</small></button>`).join('')}</div></div>`)}
let LB={};
function lab(k){ST.lab[k]=1;save();checkBadges();if(!LB[k])LB[k]={blok:{h:1,t:2,o:3},saat:{h:3,m:15},kesir:{d:4,k:1},dizi:{r:3,c:4},aci:{g:60},tablo:{a:6,b:7}}[k];const s=LB[k];let b='',ti='';const pm=(lbl,f,mn,mx)=>`<div class="pm"><button onclick="lp('${k}','${f}',-1,${mn},${mx})">−</button><span>${lbl}: <b>${s[f]}</b></span><button onclick="lp('${k}','${f}',1,${mn},${mx})">+</button></div>`;
 if(k==='blok'){const n=s.h*100+s.t*10+s.o;ti='🧱 Onluk Blokları';b=`<div class="lbig">${n}</div><p class="cen">${words(n)}</p><div class="qv">${blocks(n)}</div>${ptable(n,['Yüzler','Onlar','Birler'])}${pm('Yüzlük','h',0,9)}${pm('Onluk','t',0,9)}${pm('Birlik','o',0,9)}<p class="cen muted">${s.h*100} + ${s.t*10} + ${s.o} = ${n}</p>`}
 if(k==='saat'){ti='⏰ Saat Ustası';b=`<div class="qv">${clock(s.h,s.m)}</div><div class="lbig">${hhmm(s.h,s.m)}</div><p class="cen"><b>${saatSoz(s.h,s.m)}</b><br><span class="muted">Öğleden sonra ise: ${hhmm(s.h===12?12:s.h+12,s.m)}</span></p><div class="row wrap"><button class="btn gr sm" onclick="lc(-60)">−1 saat</button><button class="btn gr sm" onclick="lc(-5)">−5 dk</button><button class="btn gr sm" onclick="lc(-1)">−1 dk</button><button class="btn pr sm" onclick="lc(1)">+1 dk</button><button class="btn pr sm" onclick="lc(5)">+5 dk</button><button class="btn pr sm" onclick="lc(60)">+1 saat</button></div>`}
 if(k==='kesir'){ti='🍕 Kesir Yapıcı';const tp=s.k===0?'Hiç boyanmadı':s.k===s.d?'Bir bütün!':s.k===1?'Birim kesir':'Basit kesir';b=`<div class="qv" id="kpie">${pie(s.d,s.k,'#fd79a8')}</div><p class="cen muted">Boyamak için dilimlere dokun</p><div class="lbig">${FR(s.k,s.d)}</div><p class="cen"><b>${fw(s.k,s.d)}</b> · ${tp}</p>${fbar(s.d,s.k,'#fd79a8')}${pm('Payda (parça sayısı)','d',1,12)}`}
 if(k==='dizi'){ti='🔵 Çarpma Dizisi';b=`<div class="qv">${arr(s.r,s.c,'🔵')}</div><div class="lbig">${s.r} × ${s.c} = ${s.r*s.c}</div><p class="cen muted">${Array(s.r).fill(s.c).join(' + ')} = ${s.r*s.c}</p>${pm('Satır','r',1,10)}${pm('Sütun','c',1,10)}`}
 if(k==='aci'){ti='📐 Açı Ölçer';b=`<div class="qv" id="aV"></div><div class="lbig" id="aG"></div><p class="cen"><b id="aT"></b></p><input type="range" min="0" max="180" value="${s.g}" class="rng" id="aR" oninput="aciU(this.value)"><div class="row wrap">${[30,45,90,120,135,180].map(g=>`<button class="btn gr sm" onclick="aciU(${g})">${g}°</button>`).join('')}</div>`}
 if(k==='tablo'){ti='🧮 Çarpım Tablosu';let g='<div class="tt">';for(let i=0;i<=10;i++)for(let j=0;j<=10;j++){if(!i&&!j)g+='<span class="h">×</span>';else if(!i)g+=`<span class="h ${j===s.b?'hl':''}">${j}</span>`;else if(!j)g+=`<span class="h ${i===s.a?'hl':''}">${i}</span>`;else g+=`<button class="${i===s.a&&j===s.b?'sel':(i===s.a&&j<=s.b)||(j===s.b&&i<=s.a)?'hl':''}" onclick="LB.tablo={a:${i},b:${j}};swap(lab,'tablo')">${i*j}</button>`}g+='</div>';b=`<div class="lbig">${s.a} × ${s.b} = ${s.a*s.b}</div>${g}`}
 const keep=window._labk===k?(window.scrollY||document.documentElement.scrollTop):0;window._labk=k;
 show(`${bar(ti,'linear-gradient(135deg,#00cec9,#0984e3)')}<div class="pad lab2">${b}</div>`);if(keep)window.scrollTo(0,keep);
 if(k==='aci')aciU(s.g);
 if(k==='kesir')document.querySelectorAll('#kpie path,#kpie circle').forEach((p,i)=>p.addEventListener('click',()=>{const n=i+1;LB.kesir.k=LB.kesir.k===n?n-1:n;SFX.tap();swap(lab,'kesir')}))}
function aciU(v){const g=Number(v);LB.aci.g=g;const t=g===0?'Sıfır açı':g<90?'Dar açı (90°\'den küçük)':g===90?'Dik açı (tam 90°)':g<180?'Geniş açı (90° ile 180° arası)':'Doğru açı (180°)';$('#aV').innerHTML=angleS(Math.max(g,1),g+'°');$('#aG').textContent=g+'°';$('#aT').textContent=t;const r=$('#aR');if(r&&Number(r.value)!==g)r.value=g}
function lp(k,f,d,mn,mx){LB[k][f]=Math.min(mx,Math.max(mn,LB[k][f]+d));if(k==='kesir')LB.kesir.k=Math.min(LB.kesir.k,LB.kesir.d);SFX.tap();swap(lab,k)}
function lc(d){const s=LB.saat;let t=((s.h%12)*60+s.m+d+720)%720;s.h=Math.floor(t/60)||12;s.m=t%60;SFX.tap();swap(lab,'saat')}
</script>
